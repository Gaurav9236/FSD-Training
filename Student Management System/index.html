<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management System</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <h1>Student Management System</h1>

    <!-- Student Form -->
    <form id="studentForm">

        <div class="form-grid">

            <div class="input-box">
                <label>Student Name</label>
                <input type="text" id="name" placeholder="Enter student name" required>
            </div>

            <div class="input-box">
                <label>Roll No.</label>
                <input type="text" id="roll" placeholder="Enter roll no." required>
            </div>

            <div class="input-box">
                <label>Course</label>
                <select id="course" required>
                    <option value="">Select Course</option>
                    <option>B.Tech CSE</option>
                    <option>B.Tech IT</option>
                    <option>BCA</option>
                    <option>MCA</option>
                </select>
            </div>

            <div class="input-box">
                <label>Marks</label>
                <input type="number" id="marks"
                       placeholder="Enter marks"
                       min="0"
                       max="100"
                       required>
            </div>

        </div>

        <button type="submit" id="submitBtn">Submit</button>

    </form>

    <hr>

    <!-- Search -->
    <input
        type="text"
        id="search"
        class="search"
        placeholder="Search by Name or Roll No."
    >

    <!-- Statistics -->
    <div class="stats">

        <div class="stat-box">
            <span>Total Students:</span>
            <strong id="totalStudents">0</strong>
        </div>

        <div class="stat-box">
            <span>Average Marks:</span>
            <strong id="averageMarks">0</strong>
        </div>

    </div>

    <!-- Student Table -->
    <div class="table-container">

        <table>

            <thead>
                <tr>
                    <th>Roll No.</th>
                    <th>Name</th>
                    <th>Course</th>
                    <th>Marks</th>
                    <th>Grade</th>
                    <th>Actions</th>
                </tr>
            </thead>

            <tbody id="studentTable">
            </tbody>

        </table>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
